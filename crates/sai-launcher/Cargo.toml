[package]
name = "sai-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs the player's own copy of Super Adventure Island on modern Windows and Linux"
publish = false

[[bin]]
name = "SAILauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
rea-launcher-ui.workspace = true
# The Windows settings window uses the wgpu (D3D12) backend: the VM has no
# OpenGL for eframe's default glow backend. Linux keeps glow.
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
# Only the Windows console/dialog/instance helpers; the rest of the crate is
# cfg(windows) inside, and the audience rule is portable.
rea-launcher-win32.workspace = true
# Reading `hyprctl monitors -j` on Linux to keep integer scaling pixel-perfect
# under a fractional monitor scale.
serde_json = "1"

[build-dependencies]
rea-launcher-build.workspace = true

[dev-dependencies]
# Headless GUI tests (egui_kittest through AccessKit; no window, no GPU).
rea-launcher-ui = { workspace = true, features = ["testing"] }
