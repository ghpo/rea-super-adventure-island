name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The shared SDK CI, with this launcher's native configuration:
  # formatting, host tests, cargo audit/deny, sdk/ drift, launcher-check,
  # shell syntax/tests, the Linux build, the x86_64 Windows clippy/release
  # build and the Windows-target tests under Wine (headless).
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.4.3
    with:
      rust-target: x86_64-pc-windows-gnu
      apt-packages: gcc-mingw-w64-x86-64 lld zip unzip
      wine-tests: true
